name: Mailing Queue

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Wznów kolejkę mailingu (partie w granicach limitu Gmaila)
        run: |
          url="https://dokportal-api.azurewebsites.net/api/reminders/mailing-queue/run"
          # Darmowa baza budzi się do ok. minuty – ponawiamy cierpliwie (API zwraca wtedy 503).
          max_attempts=6
          for attempt in $(seq 1 $max_attempts); do
            response=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST \
              -H "X-Reminders-Key: ${{ secrets.REMINDERS_API_KEY }}" "$url") || true
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" = "202" ]; then
              echo "Odpowiedź: $body"
              exit 0
            fi
            echo "Próba $attempt/$max_attempts: kod $http_code, odpowiedź: ${body:0:200}"
            case "$http_code" in
              000|429|502|503|504) ;;
              *) echo "Błąd nieprzejściowy — bez ponawiania."; exit 1 ;;
            esac
            if [ "$attempt" -lt "$max_attempts" ]; then sleep 45; fi
          done
          echo "Endpoint niedostępny po $max_attempts próbach."
          exit 1
