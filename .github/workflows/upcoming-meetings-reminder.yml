name: Upcoming Meetings Reminder

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj endpoint przypomnień
        run: |
          url="https://dokportal-api.azurewebsites.net/api/reminders/upcoming-meetings/run"
          max_attempts=5
          for attempt in $(seq 1 $max_attempts); do
            response=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST \
              -H "X-Reminders-Key: ${{ secrets.REMINDERS_API_KEY }}" "$url") || true
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" = "200" ]; then
              echo "Odpowiedź: $body"
              exit 0
            fi
            echo "Próba $attempt/$max_attempts: kod $http_code, odpowiedź: ${body:0:200}"
            case "$http_code" in
              000|502|503|504) ;;
              *) echo "Błąd nieprzejściowy — bez ponawiania."; exit 1 ;;
            esac
            if [ "$attempt" -lt "$max_attempts" ]; then sleep 30; fi
          done
          echo "Endpoint niedostępny po $max_attempts próbach."
          exit 1
