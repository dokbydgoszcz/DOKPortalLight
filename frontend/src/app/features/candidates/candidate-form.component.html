@if (open) {
  <div class="overlay show">
    <div class="modal">
      <div class="modal-head">
        <h3>{{ editing ? 'Edytuj kandydata' : 'Nowy kandydat SKŚP' }}</h3>
        <button class="close" (click)="cancel.emit()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field">
            <label>Osoba <span class="required">*</span></label>
            <select [(ngModel)]="value.personId" name="personId">
              <option value="">— wybierz —</option>
              @for (person of people; track person.id) {
                <option [value]="person.id">{{ person.fullName }}</option>
              }
            </select>
          </div>
          <div class="field">
            <label>Rok formacji</label>
            <select [(ngModel)]="value.year" name="year">
              <option [ngValue]="1">I ROK</option>
              <option [ngValue]="2">II ROK</option>
              <option [ngValue]="3">III ROK</option>
            </select>
          </div>
          <div class="field"><label>Frekwencja (%)</label><input type="number" [(ngModel)]="value.attendancePercentage" name="attendancePercentage" /></div>
          <div class="field"><label>Liczba opinii</label><input type="number" [(ngModel)]="value.opinionsCollected" name="opinionsCollected" /></div>
          @for (year of years; track year) {
            <div class="field">
              <label>Rekolekcje — {{ romanYear(year) }} rok</label>
              <select [(ngModel)]="retreatStatus[year]" [attr.name]="'retreat' + year">
                <option value="">—</option>
                <option value="pending">oczekuje</option>
                <option value="done">zaliczone</option>
              </select>
            </div>
          }
          <div class="field full">
            <label class="checkbox-label"><input type="checkbox" [(ngModel)]="value.isFormationStopped" name="isFormationStopped" /> Formacja zatrzymana (rezygnacja, nieukończona formacja)</label>
          </div>
          @if (value.isFormationStopped) {
            <div class="field full">
              <label>Powód zatrzymania <span class="required">*</span></label>
              <textarea [(ngModel)]="value.formationStopNote" name="formationStopNote"></textarea>
            </div>
          }
        </div>
      </div>
      <div class="modal-foot">
        @if (!canSave) {
          <span class="form-hint">Uzupełnij pola oznaczone *</span>
        }
        <button class="btn ghost" (click)="cancel.emit()">Anuluj</button>
        <button class="btn primary" [disabled]="!canSave" (click)="submit()">Zapisz</button>
      </div>
    </div>
  </div>
}
