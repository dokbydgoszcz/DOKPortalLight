<div class="page-heading">
  <div><h2>Baza osób</h2><p>Jeden profil osoby, wiele ról i powiązań.</p></div>
  <div style="display:flex;gap:8px;align-items:center">
    <app-export-button list="people" />
    <button class="btn primary" (click)="openAddForm()">＋ Dodaj osobę</button>
  </div>
</div>

<div class="card">
  <div class="card-head">
    <div class="search">
      <input placeholder="Szukaj…" [value]="query()" (input)="onSearch($any($event.target).value)" />
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Osoba</th><th>Kontakt</th><th>Parafia</th><th></th></tr></thead>
      <tbody>
        @for (person of people(); track person.id) {
          <tr>
            <td><b>{{ person.fullName }}</b></td>
            <td>{{ person.email }}<br /><span class="small-muted">{{ person.phone }}</span></td>
            <td>{{ person.parishName }}</td>
            <td>
              <span class="link" (click)="openEditForm(person)">Edytuj</span>
              &nbsp;·&nbsp;
              <span class="link" style="color:var(--danger)" (click)="deletePerson(person)">Usuń</span>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="empty">Brak wyników.</td></tr>
        }
      </tbody>
    </table>
  </div>
  <app-pagination [page]="page()" [pageSize]="pageSize" [totalCount]="totalCount()" (pageChange)="onPageChange($event)"></app-pagination>
</div>

<app-person-form
  [open]="isFormOpen()"
  [value]="formValue"
  (save)="onSave($event)"
  (cancel)="onCancel()">
</app-person-form>
