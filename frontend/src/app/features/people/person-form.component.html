@if (open) {
  <div class="overlay show">
    <div class="modal">
      <div class="modal-head">
        <h3>Dodaj / edytuj osobę</h3>
        <button class="close" (click)="cancel.emit()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Imię</label><input [(ngModel)]="value.firstName" name="firstName" /></div>
          <div class="field"><label>Nazwisko</label><input [(ngModel)]="value.lastName" name="lastName" /></div>
          <div class="field"><label>E-mail</label><input [(ngModel)]="value.email" name="email" /></div>
          <div class="field"><label>Telefon</label><input [(ngModel)]="value.phone" name="phone" /></div>
          <div class="field full"><label>Uwagi</label><textarea [(ngModel)]="value.notes" name="notes"></textarea></div>
          <div class="field"><label>Miesiąc imienin</label><input type="number" min="1" max="12" [(ngModel)]="value.nameDayMonth" name="nameDayMonth" /></div>
          <div class="field"><label>Dzień imienin</label><input type="number" min="1" max="31" [(ngModel)]="value.nameDayDay" name="nameDayDay" /></div>
          <div class="field full functions">
            <label>Funkcje</label>
            @for (fn of value.functions ?? []; track $index) {
              <div class="function-row">
                <select [(ngModel)]="fn.type" [attr.name]="'fnType' + $index">
                  @for (type of functionTypes; track type) {
                    <option [value]="type">{{ functionLabels[type] }}</option>
                  }
                </select>
                @if (fn.type === 'Pastor') {
                  <select [(ngModel)]="fn.parishId" [attr.name]="'fnParish' + $index">
                    <option [ngValue]="undefined">— bez parafii —</option>
                    @for (parish of parishes; track parish.id) {
                      <option [value]="parish.id">{{ parish.name }}</option>
                    }
                  </select>
                }
                <input type="date" [(ngModel)]="fn.institutedOn" [attr.name]="'fnDate' + $index" title="Data ustanowienia / objęcia" />
                <input [(ngModel)]="fn.notes" [attr.name]="'fnNotes' + $index" placeholder="Notatka" />
                <button type="button" class="remove" title="Usuń funkcję" (click)="removeFunction($index)">×</button>
              </div>
            }
            <div><button type="button" class="btn ghost" (click)="addFunction()">＋ Dodaj funkcję</button></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" (click)="cancel.emit()">Anuluj</button>
        <button class="btn primary" (click)="submit()">Zapisz</button>
      </div>
    </div>
  </div>
}
