@if (open) {
  <div class="overlay show">
    <div class="modal">
      <div class="modal-head">
        <h3>Nowy podopieczny DOK</h3>
        <button class="close" (click)="cancel.emit()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field">
            <label>Osoba</label>
            <select [(ngModel)]="value.personId" name="personId">
              <option value="">— wybierz —</option>
              @for (person of people; track person.id) {
                <option [value]="person.id">{{ person.fullName }}</option>
              }
            </select>
          </div>
          <div class="field">
            <label>Ścieżka</label>
            <select [ngModel]="value.path" (ngModelChange)="onPathChange($event)" name="path">
              @for (path of paths; track path) {
                <option [value]="path">{{ pathLabels[path] }}</option>
              }
            </select>
          </div>
          <div class="field">
            <label>Etap</label>
            <select [(ngModel)]="value.stage" name="stage">
              @for (stage of stages; track stage) {
                <option [value]="stage">{{ stageLabels[stage] }}</option>
              }
            </select>
          </div>
          <div class="field">
            <label>Katechista prowadzący</label>
            <select [(ngModel)]="value.catechistPersonId" name="catechistPersonId">
              <option value="">— wybierz —</option>
              @for (person of people; track person.id) {
                <option [value]="person.id">{{ person.fullName }}</option>
              }
            </select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" (click)="cancel.emit()">Anuluj</button>
        <button class="btn primary" [disabled]="!value.personId || !value.catechistPersonId" (click)="submit()">Zapisz</button>
      </div>
    </div>
  </div>
}
