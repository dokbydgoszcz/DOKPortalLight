<div class="page-heading">
  <div><h2>Parafie</h2><p>Rejestr parafii Diecezji Bydgoskiej.</p></div>
  <div style="display:flex;gap:8px;align-items:center">
    <app-export-button list="parishes" />
    <button *appHasPermission="'Parishes.Manage'" class="btn primary" (click)="openAddForm()">＋ Dodaj parafię</button>
  </div>
</div>

<div class="card">
  <div class="card-head">
    <div class="search">
      <input placeholder="Szukaj…" [value]="query()" (input)="query.set($any($event.target).value)" />
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Nazwa</th><th>Miejscowość</th><th></th></tr></thead>
      <tbody>
        @for (parish of filteredParishes(); track parish.id) {
          <tr>
            <td><b>{{ parish.name }}</b></td>
            <td>{{ parish.city }}</td>
            <td>
              <ng-container *appHasPermission="'Parishes.Manage'">
                <span class="link" (click)="openEditForm(parish)">Edytuj</span>
                &nbsp;·&nbsp;
                <span class="link" style="color:var(--danger)" (click)="deleteParish(parish)">Usuń</span>
              </ng-container>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="3" class="empty">Brak parafii.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (isFormOpen()) {
  <div class="overlay show">
    <div class="modal">
      <div class="modal-head">
        <h3>{{ editingId() ? 'Edytuj parafię' : 'Nowa parafia' }}</h3>
        <button class="close" (click)="cancel()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full"><label>Nazwa (wezwanie)</label><input [(ngModel)]="newParish.name" name="name" placeholder="np. św. Antoniego z Padwy" /></div>
          <div class="field full"><label>Miejscowość</label><input [(ngModel)]="newParish.city" name="city" placeholder="np. Bydgoszcz" /></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" (click)="cancel()">Anuluj</button>
        <button class="btn primary" (click)="saveParish()">Zapisz</button>
      </div>
    </div>
  </div>
}
