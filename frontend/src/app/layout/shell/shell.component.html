<div class="app">
  <div class="sidebar-backdrop" [class.show]="isSidebarOpen()" (click)="closeSidebar()"></div>
  <aside class="sidebar" [class.open]="isSidebarOpen()">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <line x1="12" y1="3" x2="12" y2="21"></line>
          <line x1="5" y1="9" x2="19" y2="9"></line>
        </svg>
      </div>
      <div><b>DOK Portal Light</b><span>Diecezja</span></div>
    </div>
    <div class="nav-title">Menu</div>
    @for (item of visibleNavItems(); track item.path) {
      <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-ico">{{ item.icon }}</span> {{ item.label }}
      </a>
    }
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="mobile-menu" (click)="toggleSidebar()" aria-label="Menu">☰</button>
        <div class="page-title">DOK Portal Light</div>
      </div>
      <div class="top-actions">
        @for (role of auth.roles(); track role) {
          <span class="pill blue">{{ role }}</span>
        }
        <button class="btn ghost small" (click)="logout()">Wyloguj</button>
      </div>
    </header>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
    <app-footer />
  </main>
</div>

<app-toast-container></app-toast-container>
